{% extends 'base.html' %}{% block content %}<section class="login"><div class="brand">FABI<span>CONCIERGERIE · CRM</span></div><h1>Bienvenue chez vous.</h1><p>Connectez-vous à votre espace de travail.</p>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Identifiant<input name="username" required maxlength="80" autocomplete="username" autofocus></label><label>Mot de passe<input type="password" name="password" required maxlength="256" autocomplete="current-password"></label><button>Se connecter →</button></form><p class="muted">Un compte personnel est nécessaire. Contactez votre administrateur.</p></section>{% endblock %}
